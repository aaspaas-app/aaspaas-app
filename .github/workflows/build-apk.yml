name: Build Android APK

# Runs by itself on every push to main, and you can also start it by hand:
# GitHub > Actions > "Build Android APK" > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Create the Android project and give it the right permissions
        run: |
          flutter create --org app.aaspaas --project-name aaspaas_app --platforms=android --no-pub _shell
          rm -rf android
          mv _shell/android android
          rm -rf _shell
          dart tool/prepare_android.dart

      - run: flutter pub get

      # Shows problems in the log but does not stop the build.
      - name: Check the code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build the APK
        run: flutter build apk --release --dart-define=API_BASE=${{ vars.API_BASE || 'https://zomo.pk/wp-json/aaspaas/v1' }}

      - uses: actions/upload-artifact@v4
        with:
          name: aaspaas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
